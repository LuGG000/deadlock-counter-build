name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - name: Build
        run: >
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0
          go build -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o deadlock-counter.exe .
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" deadlock-counter.exe --title "$GITHUB_REF_NAME" --generate-notes
